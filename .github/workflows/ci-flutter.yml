# Reusable CI for Flutter (roamkit-bbuem-apk)

name: CI Flutter

on:
  workflow_call:
    inputs:
      flutter-version:
        required: false
        type: string
        default: "3.32.7"

jobs:
  analyze-and-test:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
